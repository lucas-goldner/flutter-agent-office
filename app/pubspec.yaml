name: agent_office
description: "Agent Office: the browser client, in Flutter web with flutter_scene for the 3D office."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  office_shared:
    path: ../packages/office_shared

  cupertino_icons: ^1.0.8
  flutter_scene: ^0.23.0
  vector_math: ^2.4.3
  web: ^1.1.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  flutter_web_plugins:
    sdk: flutter
  markdown: ^7.3.1
  xterm: ^4.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1
  fake_async: ^1.3.0

flutter:

  assets:
    - flutter_scene_generated/
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.ttf
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700

    # The terminals' monospace face (window and laptop screens): JetBrains Mono (no ligatures), with
    # DejaVu Sans Mono for the box drawing and symbols it lacks. Both bundled: no system font on the web.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
    # Terminal symbols neither face has (Claude Code's ⏺ ⎿, spinners' braille, ✻ ✔ …): subsets of
    # Noto Sans Symbols 2 and Noto Sans Symbols (arrows, technical, box, shapes, dingbats, braille).
    - family: NotoSansSymbols2Term
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Term.ttf
    - family: NotoSansSymbolsTerm
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Term.ttf
