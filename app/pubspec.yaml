name: agent_office
description: "Agent Office: the browser client, in Flutter web with flutter_scene for the 3D office."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_scene: ^0.23.0
  vector_math: ^2.4.3
  web: ^1.1.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  flutter_web_plugins:
    sdk: flutter
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  assets:
    - flutter_scene_generated/
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

