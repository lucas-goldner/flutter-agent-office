name: agent_office_server
description: The agent office server. It runs the workers' terminals, keeps the office's state and serves the Flutter web client.
publish_to: none
# The office's version. Releases are named after its major.minor plus the number of commits on main
# (v0.1.68, see tool/build.dart and .github/workflows/release.yml): bump it to start a new minor.
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  office_pty:
    path: ../packages/office_pty
  office_shared:
    path: ../packages/office_shared
  path: ^1.9.0
  pointycastle: ^4.0.0
  pty2: ^0.5.4
  relic: ^1.2.0
  web_socket: ^1.0.0
  xterm_core:
    path: ../packages/xterm_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
